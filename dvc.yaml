stages:
  ingest:
    cmd: python -m src.acquire_data
    deps:
      - src/acquire_data.py
      - params.yaml
    outs:
      - data/raw/engsaf
  clean:
    cmd: python -m src.clean_data
    deps:
      - src/clean_data.py
      - data/raw/engsaf
      - params.yaml
    outs:
      - data/processed/engsaf
      - reports/cleaning_report.json
  explore:
    cmd: python -m src.profile_data
    deps:
      - src/profile_data.py
      - data/processed/engsaf
    outs:
      - reports/data_profile.json
      - reports/engsaf_eda.md
  features:
    cmd: python -m src.extract_features
    deps:
      - src/extract_features.py
      - src/features.py
      - data/processed/engsaf
      - params.yaml
    outs:
      - data/features/engsaf
  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/features.py
      - data/features/engsaf
      - data/processed/engsaf
      - params.yaml
    outs:
      - models
  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/features.py
      - src/grouped_split.py
      - models
      - data/features/engsaf
      - data/processed/engsaf
      - params.yaml
    outs:
      - reports/baseline_metrics.json
      - reports/model2_comparison.md
      - reports/error_analysis.md
