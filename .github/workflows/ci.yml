name: CI - Code Quality, Security & Test Suite

on:
  push:
    branches: [main, feature/**, chore/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 120.
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Security scan with Bandit
        run: |
          bandit -r src/ -ll -ii

      - name: Verify no data files committed to Git
        run: |
          if git ls-files | grep -E '\.(csv|parquet|pkl|joblib)$'; then
            echo "ERROR: Data or model binary files found tracked in Git!"
            exit 1
          else
            echo "SUCCESS: Git tree is clean of data and binary artifacts."
          fi

  unit-and-contract-tests:
    name: Pytest Suite & Pipeline Verification
    needs: lint-and-security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/ --durations=10

      - name: Validate DVC Pipeline Definition
        run: |
          dvc status
