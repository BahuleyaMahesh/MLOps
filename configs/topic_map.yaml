# Topic Taxonomy Scaffold (Model 1: Topic Classification)
# ========================================================
# STATUS: PROVISIONAL / PENDING DATASET PROFILING AND TEAM REVIEW
#
# NOTICE:
# This taxonomy is an unfinalized structural scaffold.
# Do NOT treat these topic mappings as finalized ground truth.
# Once Decision D0 is resolved and Member 1 profiles the actual tag distribution:
# 1. 8 to 12 coarse topics will be finalized and approved by the team.
# 2. Tag phrases will be mapped to coarse topic IDs.
#
# Multi-Topic Conflict Rule:
# If a question's tags match multiple topics, map to the dominant topic if confidence >= threshold,
# otherwise drop/flag the sample and log the occurrence.

taxonomy_metadata:
  status: "provisional_scaffold"
  finalized: false
  target_topic_count_min: 8
  target_topic_count_max: 12
  approval_status: "pending_profiling"
  last_updated: "2026-10-14"
  notes: >
    Pending dataset schema verification and tag frequency profiling.
    The final taxonomy will represent 8-12 coarse engineering/programming topics.

conflict_resolution:
  policy: "dominant_topic_or_drop"
  dominance_ratio_threshold: 0.60
  unresolved_action: "drop_and_log"

